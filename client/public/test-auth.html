<!DOCTYPE html>
<html>
<head>
    <title>Test Autenticación</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
        .box { margin: 20px 0; padding: 15px; background: #2d2d2d; border-radius: 8px; }
        .success { background: #1a4d2e; }
        .error { background: #4d1a1a; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Test de Autenticación</h1>
    
    <div class="box">
        <h3>1. Test Login</h3>
        <button onclick="testLogin()">Login como Admin</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="box">
        <h3>2. Ver LocalStorage</h3>
        <button onclick="verLocalStorage()">Ver LocalStorage</button>
        <div id="localStorageResult"></div>
    </div>
    
    <div class="box">
        <h3>3. Test ProtectedRoute Logic</h3>
        <button onclick="testProtectedRoute()">Verificar si puede acceder a Dashboard</button>
        <div id="protectedResult"></div>
    </div>
    
    <div class="box">
        <h3>4. Limpiar Todo</h3>
        <button onclick="limpiarTodo()">Limpiar LocalStorage</button>
    </div>

    <script>
        async function testLogin() {
            const result = document.getElementById('loginResult');
            result.innerHTML = '<p>⏳ Intentando login...</p>';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@vozsegura.com',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    result.innerHTML = `
                        <div class="success">
                            <p>✅ Login exitoso!</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="error">❌ Error: ${data.message}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function verLocalStorage() {
            const result = document.getElementById('localStorageResult');
            const token = localStorage.getItem('token');
            const usuarioStr = localStorage.getItem('usuario');
            
            let html = '<div>';
            
            if (!token) {
                html += '<p class="error">❌ No hay token</p>';
            } else {
                html += `<p class="success">✅ Token existe: ${token.substring(0, 50)}...</p>`;
            }
            
            if (!usuarioStr) {
                html += '<p class="error">❌ No hay usuario</p>';
            } else {
                try {
                    const usuario = JSON.parse(usuarioStr);
                    html += '<p class="success">✅ Usuario encontrado:</p>';
                    html += `<pre>${JSON.stringify(usuario, null, 2)}</pre>`;
                    html += `<p><strong>ROL:</strong> ${usuario.rol}</p>`;
                } catch (e) {
                    html += `<p class="error">❌ Error parseando usuario: ${e.message}</p>`;
                }
            }
            
            html += '</div>';
            result.innerHTML = html;
        }
        
        function testProtectedRoute() {
            const result = document.getElementById('protectedResult');
            const token = localStorage.getItem('token');
            const usuarioStr = localStorage.getItem('usuario');
            const isAuthenticated = !!token;
            
            let html = '<div>';
            
            if (!isAuthenticated) {
                html += '<p class="error">❌ NO AUTENTICADO - Redirigiría a /login</p>';
                result.innerHTML = html + '</div>';
                return;
            }
            
            let usuario = null;
            try {
                if (usuarioStr) {
                    usuario = JSON.parse(usuarioStr);
                }
            } catch (error) {
                html += `<p class="error">❌ Error parseando usuario: ${error.message}</p>`;
                result.innerHTML = html + '</div>';
                return;
            }
            
            html += '<p class="success">✅ Usuario autenticado</p>';
            html += `<pre>Usuario: ${JSON.stringify(usuario, null, 2)}</pre>`;
            
            // Check adminOnly
            const adminOnly = true; // Dashboard requiere admin
            
            if (adminOnly) {
                if (!usuario) {
                    html += '<p class="error">❌ No hay usuario - Redirigiría a /login</p>';
                } else {
                    html += `<p>🔍 Verificando rol: "${usuario.rol}"</p>`;
                    
                    if (usuario.rol !== 'admin') {
                        html += `<p class="error">❌ NO ES ADMIN (rol: ${usuario.rol}) - Redirigiría a /mis-denuncias</p>`;
                    } else {
                        html += '<p class="success">✅✅✅ ES ADMIN - PUEDE ACCEDER AL DASHBOARD!</p>';
                    }
                }
            }
            
            html += '</div>';
            result.innerHTML = html;
        }
        
        function limpiarTodo() {
            localStorage.clear();
            alert('LocalStorage limpiado!');
            document.querySelectorAll('[id$="Result"]').forEach(el => el.innerHTML = '');
        }
    </script>
</body>
</html>
